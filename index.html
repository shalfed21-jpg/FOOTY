<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOOTY — Головна сторінка</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero-section">
        <div class="container">

            <div class="hero-grid">

                <!-- Ліва частина: зображення -->
                <div class="hero-image-wrapper">
                    <img
                        src="images/girl.jpg"
                        alt="Ілюстрація дівчинки, що грає у футбол"
                        class="hero-main-img"
                    >
                </div>

                <!-- Права частина: контент -->
                <div class="hero-content">

                    <!-- Шапка сайту -->
                    <header class="site-header">

                        <a href="index.html" class="logo">
                            <div class="logo-badge"></div>
                            <span>FOOTY</span>
                        </a>

                        <nav class="nav-links">
                            <a href="programs.html">ПРОГРАМИ</a>
                            <a href="#coaches">ТРЕНЕРИ</a>
                            <a href="#faq">FAQ</a>
                        </nav>

                        <a href="signup.html" class="btn btn-red btn-sm">
                            Записатися
                        </a>

                    </header>

                    <!-- Головний заголовок -->
                    <div class="hero-title-box">

                        <h1>
                            Розвиток дитини через<br>
                            <span class="text-green">рух та гру</span>
                        </h1>

                        <!-- Декоративний футбольний м'яч -->
                        <svg
                            class="sketch-ball-svg"
                            viewBox="0 0 64 64"
                            fill="none"
                            stroke="#222"
                            stroke-width="2.5"
                        >
                            <circle cx="32" cy="32" r="26"/>
                            <polygon points="32,18 42,25 38,37 26,37 22,25"/>
                            <line x1="32" y1="6" x2="32" y2="18"/>
                            <line x1="54" y1="20" x2="42" y2="25"/>
                            <line x1="47" y1="50" x2="38" y2="37"/>
                            <line x1="17" y1="50" x2="26" y2="37"/>
                            <line x1="10" y1="20" x2="22" y2="25"/>
                        </svg>

                    </div>

                    <p class="hero-subtitle">
                        Заняття для дітей від 9 місяців до 6 років
                    </p>

                    <!-- Кнопка запису та відгуки -->
                    <div class="hero-action-row">

                        <a href="signup.html" class="btn btn-red btn-lg">
                            Записатися
                        </a>

                        <div class="social-proof">

                            <div class="avatars">

                                <img
                                    src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=80&q=80"
                                    alt="Батько"
                                >

                                <img
                                    src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=80&q=80"
                                    alt="Мати"
                                >
                                <img
                                    src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=80&q=80"
                                    alt="Мати"
                                >

                            </div>

                            <span>4.9 • 120+ щасливих родин</span>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

</body>
</html>
